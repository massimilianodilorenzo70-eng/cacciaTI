name: Aggiorna contingente caccia alta

on:
  schedule:
    # Solo nei giorni veri della caccia settembrina di camoscio e capriolo
    # (dal 5 al 19 e dal 23 al 27 settembre, per la stagione 2026, secondo
    # le Disposizioni al cacciatore — la pausa del 20-22 è normale). Fuori
    # da questo periodo il contingente non serve leggerlo: non si muove
    # comunque finché la caccia non riapre, e la pagina può anche cambiare
    # aspetto a stagione chiusa (lo stato perde il grassetto e cambia testo),
    # cosa che fuori da queste date produrrebbe solo email di errore inutili.
    # Le date esatte vanno riviste ogni anno quando esce il nuovo calendario.
    - cron: "0 */4 5-19,23-27 9 *"
  workflow_dispatch: {}   # permette di lanciarlo a mano da GitHub, in qualsiasi momento

permissions:
  contents: write

jobs:
  update-contingente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui lo scraper
        run: python scripts/fetch_contingente.py

      - name: Commit se qualcosa è cambiato
        run: |
          git config user.name "cacciaTI-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/contingente_alta.json
          git diff --cached --quiet || git commit -m "Aggiorna contingente caccia alta [bot]"
          git push
