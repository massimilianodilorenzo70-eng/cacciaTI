name: Aggiorna contingente caccia alta

on:
  schedule:
    # Solo a settembre, quando la caccia alta di camoscio e capriolo è
    # davvero in corso (le date esatte cambiano un po' di anno in anno,
    # ma restano sempre dentro settembre). Fuori da questo mese la pagina
    # potrebbe cambiare aspetto a stagione chiusa, e girare comunque
    # produrrebbe solo email di errore inutili per undici mesi l'anno,
    # senza nessun beneficio: il contingente non si aggiorna comunque
    # finché la caccia alta non riapre l'anno dopo.
    - cron: "0 */4 * 9 *"
  workflow_dispatch: {}   # permette di lanciarlo a mano da GitHub, in qualsiasi mese

permissions:
  contents: write

jobs:
  update-contingente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui lo scraper
        run: python scripts/fetch_contingente.py

      - name: Commit se qualcosa è cambiato
        run: |
          git config user.name "cacciaTI-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/contingente_alta.json
          git diff --cached --quiet || git commit -m "Aggiorna contingente caccia alta [bot]"
          git push
