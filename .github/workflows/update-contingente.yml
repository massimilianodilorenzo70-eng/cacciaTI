name: Aggiorna contingente caccia alta

on:
  schedule:
    # Solo nel periodo di caccia di camoscio e capriolo, le uniche due specie
    # col contingente ufficiale: dal 5 al 17 settembre per la stagione 2026
    # (finestre delle categorie di camoscio e capriolo nel regolamento).
    # Il resto della caccia alta (cervo, 18-19 e 23-27 settembre) non ha
    # contingente da leggere. Fuori da queste date la pagina non si muove e
    # a stagione chiusa cambia aspetto (lo stato perde il grassetto e il
    # testo), cosa che produrrebbe solo email di errore inutili.
    # Le date vanno riviste ogni anno quando esce il nuovo calendario.
    - cron: "0 */4 5-17 9 *"
  workflow_dispatch: {}   # permette di lanciarlo a mano da GitHub, in qualsiasi momento

permissions:
  contents: write

jobs:
  update-contingente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Esegui lo scraper
        run: python scripts/fetch_contingente.py

      - name: Commit se qualcosa è cambiato
        run: |
          git config user.name "cacciaTI-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/contingente_alta.json
          git diff --cached --quiet || git commit -m "Aggiorna contingente caccia alta [bot]"
          git push
