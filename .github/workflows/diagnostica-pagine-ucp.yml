name: Diagnostica pagine UCP (regolamenti)

# Solo avvio manuale: salva in debug/ucp/ una copia delle pagine pubbliche
# dell'Ufficio della caccia e della pesca dove escono regolamento, calendari
# e decreti, per capire come sono fatte prima di scrivere un controllo
# automatico dei nuovi documenti.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  salva-pagine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scarica le pagine ufficiali
        run: |
          mkdir -p debug/ucp
          UA="cacciaTI-app/1.0 (uso personale non commerciale; https://github.com/massimilianodilorenzo70-eng/cacciaTI)"
          scarica() {
            curl -sSL --max-time 30 -A "$UA" -o "debug/ucp/$1.html" -w "$1: %{http_code} %{size_download} byte\n" "$2" || echo "$1: ERRORE"
          }
          scarica caccia-tardo-autunnale "https://www4.ti.ch/dt/da/ucp/temi/caccia/caccia/caccia-tardo-autunnale"
          scarica caccia-al-cinghiale "https://www4.ti.ch/dt/da/ucp/temi/caccia/caccia/caccia-al-cinghiale"
          scarica caccia "https://www4.ti.ch/dt/da/ucp/temi/caccia/caccia"
          scarica temi-caccia "https://www4.ti.ch/dt/da/ucp/temi/caccia"
          ls -la debug/ucp/

      - name: Salva le copie nel repository
        run: |
          git config user.name "cacciaTI-bot"
          git config user.email "actions@users.noreply.github.com"
          git add debug/ucp
          git diff --cached --quiet || git commit -m "Diagnostica: copia pagine UCP [bot]"
          git pull --rebase
          git push
